# Start everything with:  docker compose up --build
# API docs:  http://localhost:8000/docs
#
# The passwords below are for local development only.

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: multi_tenant_crm
      MYSQL_USER: crm
      MYSQL_PASSWORD: crm_password
    ports:
      - "3307:3306"   # 3307 on your PC, so it does not clash with a MySQL you already run on 3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    environment: &app_settings
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: multi_tenant_crm
      DB_USER: crm
      DB_PASSWORD: crm_password
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    build: .
    command: ["python", "worker.py"]
    environment: *app_settings
    depends_on:
      # Wait until the API is up, because the API container creates the tables.
      api:
        condition: service_healthy

volumes:
  mysql_data:
